[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-health-companion"
version = "0.7.0"
description = "Ambulance pre-alert companion: honest emergency scores, signed audit, FHIR R4 export, mission case file (pilot software, NOT a medical device)"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "Roberto Locatelli"}]
readme = "README.md"
# cryptography is REQUIRED since 0.6.1: without it the audit bridge refuses to record unsigned clinical events
# (opt-in only via OMEGA_HEALTH_ALLOW_UNSIGNED=1). See audit_bridge.FirmaNonDisponibile.
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/omega-health-companion"

[project.scripts]
ambulanza-cli = "ambulanza_cli:main"

[tool.setuptools]
py-modules = ['bacheca_store', 'chems_receipt', 'swissmedic_gtin_atc', 'operatori', 'ambulanza_cli', 'ambulanza_intelligente', 'audit_bridge', 'barella_prealert', 'companion_seed', 'coordinamento', 'fhir_export', 'fhir_chems', 'chems_validate', 'chems_ingest', 'interazioni_farmaci', 'mission_case', 'news2_certificate', 'prealert_criteria', 'scores_emergenza', 'team_comms', 'verbale_probatorio', 'health_verify']
