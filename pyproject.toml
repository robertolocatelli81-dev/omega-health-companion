[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-health-companion"
version = "0.1.2"
description = "Ambulance pre-alert companion: honest emergency scores, signed audit, FHIR R4 export, mission case file (pilot software, NOT a medical device)"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.9"
authors = [{name = "Roberto Locatelli"}]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/omega-health-companion"

[project.scripts]
ambulanza-cli = "ambulanza_cli:main"

[tool.setuptools]
py-modules = ['ambulanza_cli', 'ambulanza_intelligente', 'audit_bridge', 'barella_prealert', 'companion_seed', 'fhir_export', 'interazioni_farmaci', 'mission_case', 'scores_emergenza', 'team_comms']
