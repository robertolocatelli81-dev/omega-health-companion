name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both configurations a reviewer can be in: bare stdlib ("base" audit level) and with the
        # optional `cryptography` ("firma-locale": per-operator Ed25519 signatures, verified). The
        # private Part 11 engine is never present here. Until 2026-09-11 CI ran only the bare case and
        # the signed level was untested in CI (2/20 tests failed with cryptography installed).
        crypto: ["none", "cryptography"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional dependency
        if: matrix.crypto == 'cryptography'
        run: pip install cryptography
      - name: Unit + end-to-end (HTTP server, sandboxed ledger and audit trail) — ${{ matrix.crypto }}
        env:
          OMEGA_PACKAGE_DIR: /nonexistent
          # bare stdlib: since 0.6.1 the audit bridge is fail-closed (no unsigned events unless opted in);
          # this job opts in EXPLICITLY so the declared "base" level stays tested. The cryptography job does not.
          OMEGA_HEALTH_ALLOW_UNSIGNED: ${{ matrix.crypto == 'none' && '1' || '' }}
        run: |
          for t in test_*.py; do
            echo "== $t"
            python3 "$t"
          done
      - name: Same suite collected in ONE process (profile must not leak between files)
        env:
          OMEGA_PACKAGE_DIR: /nonexistent
          OMEGA_HEALTH_ALLOW_UNSIGNED: ${{ matrix.crypto == 'none' && '1' || '' }}   # same opt-in as the step above (first run: 503, fail-closed)
        run: python3 -m unittest discover -p "test_*.py"
      - name: Same suite with OMEGA_PROFILO exported (the configuration that exposed the setdefault bug)
        env:
          OMEGA_PACKAGE_DIR: /nonexistent
          OMEGA_HEALTH_ALLOW_UNSIGNED: ${{ matrix.crypto == 'none' && '1' || '' }}
        run: |
          OMEGA_PROFILO=comunicazione python3 -m unittest discover -p "test_*.py"
          OMEGA_PROFILO=punteggi python3 -m unittest discover -p "test_*.py"
      - name: Demo runs to completion
        run: python3 demo.py > /dev/null
      - name: Hostile-input regression must fail on a deliberately broken validator (the bench can fail)
        run: |
          cp barella_prealert.py /tmp/b.bak
          sed -i 's/if k in vitali and not isinstance(v, bool):/if False:/' barella_prealert.py
          if python3 test_input_types.py > /dev/null 2>&1; then echo "::error::bench did not detect the broken validator"; exit 1; fi
          cp /tmp/b.bak barella_prealert.py

  verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the independent verifiers (Go std-only; Rust with ed25519-dalek)
        run: |
          pip install cryptography
          (cd verifiers/go && go vet ./... && go build -o /tmp/health-verify-go .)
          (cd verifiers/rust && cargo build --release)
      - name: Differential oracle — Python / JS / Go / Rust must agree on every fixture (absence = failure)
        env:
          OMEGA_PACKAGE_DIR: /nonexistent
          HEALTH_VERIFY_GO: /tmp/health-verify-go
        run: python3 verifiers/differential.py --require js,go,rust
  chems-conformance:
    # CH EMS (Switzerland, ch.fhir.ig.ch-ems 2.0.0-ballot): the pre-alert document is validated with the OFFICIAL
    # HL7 validator against CHEmsDocument. Errors fail the job; a deliberately broken document must fail too
    # (the measurement has to be able to fail before its green means anything).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: "temurin", java-version: "17"}
      - name: Cache the FHIR validator and IG packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir
          key: fhir-validator-6.10.4-ch-ems-2.0.0-ballot
      - name: "Structural tests of the CH EMS exporter and reader (null controls included; jwcrypto = independent JWS oracle)"
        run: |
          pip install cryptography jwcrypto
          python3 test_fhir_chems.py
          python3 test_chems_ingest.py
      - name: "Official validator - the full and the minimal pre-alert documents must have 0 errors"
        run: python3 chems_validate.py --strict
      - name: "Official validator - the SIGNED sample (Bundle.signature + attester) must have 0 errors; a tampered copy must fail our verifier"
        run: |
          python3 chems_validate.py --strict --doc examples/chems_document_sample_signed.json
          python3 chems_validate.py --verify-signature examples/chems_document_sample_signed.json --allow-unregistered   # public sample key: format, not trust
          if python3 chems_validate.py --verify-signature examples/chems_document_sample_signed.json; then echo "::error::an unregistered key was accepted as trusted"; exit 1; fi
          python3 - <<'EOF'
          import json
          d = json.load(open("examples/chems_document_sample_signed.json")); d["entry"][1]["resource"]["text"]["div"] = d["entry"][1]["resource"]["text"]["div"].upper()
          json.dump(d, open("tampered.json", "w"))
          EOF
          if python3 chems_validate.py --verify-signature tampered.json --allow-unregistered; then echo "::error::tampered signed document accepted"; exit 1; fi
      - name: "Official validator - a document without Composition must FAIL (positive control)"
        run: |
          python3 - <<'EOF'
          import json
          from chems_validate import build_sample
          b = build_sample(); b["entry"] = b["entry"][1:]
          json.dump(b, open("broken.json", "w"))
          EOF
          if python3 chems_validate.py --strict --doc broken.json; then echo "validator accepted a broken document"; exit 1; fi
