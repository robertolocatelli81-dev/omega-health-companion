name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both configurations a reviewer can be in: bare stdlib ("base" audit level) and with the
        # optional `cryptography` ("firma-locale": per-operator Ed25519 signatures, verified). The
        # private Part 11 engine is never present here. Until 2026-09-11 CI ran only the bare case and
        # the signed level was untested in CI (2/20 tests failed with cryptography installed).
        crypto: ["none", "cryptography"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional dependency
        if: matrix.crypto == 'cryptography'
        run: pip install cryptography
      - name: Unit + end-to-end (HTTP server, sandboxed ledger and audit trail) — ${{ matrix.crypto }}
        env:
          OMEGA_PACKAGE_DIR: /nonexistent
        run: |
          for t in test_*.py; do
            echo "== $t"
            python3 "$t"
          done
      - name: Demo runs to completion
        run: python3 demo.py > /dev/null
      - name: Hostile-input regression must fail on a deliberately broken validator (the bench can fail)
        run: |
          cp barella_prealert.py /tmp/b.bak
          sed -i 's/if k in vitali and not isinstance(v, bool):/if False:/' barella_prealert.py
          if python3 test_input_types.py > /dev/null 2>&1; then echo "::error::bench did not detect the broken validator"; exit 1; fi
          cp /tmp/b.bak barella_prealert.py
